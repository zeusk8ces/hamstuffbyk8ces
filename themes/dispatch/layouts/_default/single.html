{{ define "main" }}

<div class="page-header">
  <p class="page-overline">{{ $.Site.Params.callsign }}</p>
  <h1 class="page-title">{{ .Title }}</h1>
  <div class="page-rule"></div>
</div>

<div class="content-grid">
  <main class="main-col page-body">
    {{ .Content }}
  </main>
  <aside class="rail-col">
    <div class="rail-block">
      <div class="rail-rule"></div>
      <p class="rail-label">Watch Along</p>
      <a href="{{ .Site.Params.youtube }}" target="_blank" rel="noopener" class="yt-card">
        <p class="yt-card-eyebrow">YouTube</p>
        <p class="yt-card-name">@ZeusK8CES</p>
        <p class="yt-card-sub">Field activations &amp; the CW journey</p>
      </a>
    </div>
    <div class="rail-block">
      <div class="rail-rule"></div>
      <p class="rail-label">Quick Links</p>
      <div class="quick-links">
        <a href="{{ "/field-reports/" | relURL }}" class="quick-link">
          <span>Field Reports</span><span class="quick-link-arrow">→</span>
        </a>
        <a href="https://pota.app" target="_blank" rel="noopener" class="quick-link">
          <span>POTA.app</span><span class="quick-link-arrow">↗</span>
        </a>
        <a href="{{ .Site.Params.qrz }}" target="_blank" rel="noopener" class="quick-link">
          <span>QRZ</span><span class="quick-link-arrow">↗</span>
        </a>
      </div>
    </div>
  </aside>
</div>

{{ end }}
